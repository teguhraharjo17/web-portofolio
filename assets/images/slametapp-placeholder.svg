<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0d111a"/>
  <!-- Phone Mockup Frame -->
  <rect x="210" y="30" width="180" height="340" rx="24" fill="#141824" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="220" y="45" width="160" height="310" rx="14" fill="#090b10"/>
  <!-- App Header -->
  <rect x="230" y="58" width="140" height="24" rx="4" fill="#1c2233"/>
  <text x="240" y="74" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">SlametApp</text>
  <circle cx="355" cy="70" r="4" fill="#22c55e"/>
  <!-- Balance Card -->
  <rect x="230" y="90" width="140" height="52" rx="8" fill="#182033" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="240" y="105" fill="#94a3b8" font-family="sans-serif" font-size="8">Kas Warga &amp; IPL</text>
  <text x="240" y="125" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Rp 14.850.000</text>
  <text x="240" y="136" fill="#22c55e" font-family="sans-serif" font-size="7">✓ Transparan &amp; Terverifikasi RT</text>
  <!-- List Items -->
  <rect x="230" y="152" width="140" height="28" rx="6" fill="#121622"/>
  <circle cx="242" cy="166" r="6" fill="#3b82f6"/>
  <text x="254" y="165" fill="#f8fafc" font-family="sans-serif" font-size="8" font-weight="bold">IPL Bulan Ini</text>
  <text x="254" y="174" fill="#22c55e" font-family="sans-serif" font-size="7">Status: Approved RT</text>
  
  <rect x="230" y="186" width="140" height="28" rx="6" fill="#121622"/>
  <circle cx="242" cy="200" r="6" fill="#10b981"/>
  <text x="254" y="199" fill="#f8fafc" font-family="sans-serif" font-size="8" font-weight="bold">Pemasukan Kas</text>
  <text x="254" y="208" fill="#94a3b8" font-family="sans-serif" font-size="7">+ Rp 250.000 / Rumah</text>

  <rect x="230" y="220" width="140" height="28" rx="6" fill="#121622"/>
  <circle cx="242" cy="234" r="6" fill="#f59e0b"/>
  <text x="254" y="233" fill="#f8fafc" font-family="sans-serif" font-size="8" font-weight="bold">Pengeluaran Kebersihan</text>
  <text x="254" y="242" fill="#94a3b8" font-family="sans-serif" font-size="7">- Rp 1.200.000 (Tercatat)</text>
  
  <!-- Action Button -->
  <rect x="230" y="315" width="140" height="24" rx="6" fill="#3b82f6"/>
  <text x="300" y="331" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Bayar IPL &amp; Cek Arus Kas</text>
</svg>
